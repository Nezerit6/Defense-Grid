block.dg-radar.name = Radar
block.dg-radar.description = Sweeps its area with a rotating beam. Radars join into one network: Skyguard turrets fire at anything the network sees, and an alarm sounds when an air enemy enters it.
block.dg-skyguard.name = Skyguard
block.dg-skyguard.description = Anti-air missile launcher. On its own it only covers a small radius, but inside a radar network it hits air targets far beyond it.

block.dg-arclet.name = Arclet
block.dg-arclet.description = Fires arcs of electricity at ground targets. Requires power to operate.

block.dg-needler.name = Needler
block.dg-needler.description = Rapidly fires small projectiles at enemies. Accepts copper, graphite and pyratite as ammunition.

block.dg-shatter.name = Shatter
block.dg-shatter.description = Fires artillery shells that fragment into piercing shrapnel on impact. Only targets ground units.

block.dg-cryolance.name = Cryolance
block.dg-cryolance.description = Charges and releases bursts of cryofluid projectiles at ground targets. Requires power and charging time.

block.dg-arcflash.name = Arcflash
block.dg-arcflash.description = Launches guided missiles that explode on impact with ground targets. Requires blast compound as ammunition.

block.dg-smoke-test.name = Smoke Test
block.dg-smoke-test.description = Sandbox only. Keeps puffing the turret smoke like a plant chimney. Tap it to tweak the smoke.

block.dg-pulse.name = Pulse
block.dg-pulse.description = Fires an energy bolt that ricochets from enemy to enemy, getting faster and stronger with every bounce.

block.dg-glaive.name = Glaive
block.dg-glaive.description = Throws a spinning blade that cuts through everything on its way out, then comes back and cuts again. Catching the blade speeds up the next throw.

block.dg-singularity.name = Singularity
block.dg-singularity.description = Charges up and launches a gravity well that drags ground units together, crushes them and finally collapses in a blast that throws them apart.

block.dg-beacon.name = Beacon
block.dg-beacon.description = Tags a target with a marker dart. The marker follows the tagged unit until a shell falls from the sky onto it.

block.dg-capacitor.name = Capacitor
block.dg-capacitor.description = Hoards energy while nothing is in range, storing up to twelve orbs. When an enemy shows up, it unleashes the whole stored barrage before settling into a steady fire.

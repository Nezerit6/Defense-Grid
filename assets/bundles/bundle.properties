block.dg-arclet.name = Arclet
block.dg-arclet.description = Fires arcs of electricity at ground targets. Requires power to operate.

block.dg-needler.name = Needler
block.dg-needler.description = Rapidly fires small projectiles at enemies. Accepts copper, graphite and pyratite as ammunition.

block.dg-shatter.name = Shatter
block.dg-shatter.description = Fires artillery shells that fragment into piercing shrapnel on impact. Only targets ground units.

block.dg-cryolance.name = Cryolance
block.dg-cryolance.description = Charges and releases bursts of cryofluid projectiles at ground targets. Requires power and charging time.

block.dg-arcflash.name = Arcflash
block.dg-arcflash.description = Launches guided missiles that explode on impact with ground targets. Requires blast compound as ammunition.

block.dg-smoke-test.name = Smoke Test
block.dg-smoke-test.description = Sandbox only. Keeps puffing the turret smoke like a plant chimney. Tap it to tweak the smoke.

block.dg-stormcoil.name = Stormcoil
block.dg-stormcoil.description = A tesla coil that throws lightning from its crown. The bolt jumps between up to five ground targets.

block.dg-quake.name = Quake
block.dg-quake.description = Heavy mortar. Lobs shells high into the air that crash down on ground targets. Accepts graphite, silicon and blast compound.

block.dg-glacier.name = Glacier
block.dg-glacier.description = Launches slow orbs of frozen cryofluid that shatter into ice shards and freeze everything nearby. Requires cryofluid and power.

block.dg-hornet.name = Hornet
block.dg-hornet.description = Missile pod. Fires salvos of four small missiles at air and ground targets. Accepts blast compound, pyratite and silicon.

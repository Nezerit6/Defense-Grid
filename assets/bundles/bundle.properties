block.dg-gravitor.name = Gravitor
block.dg-gravitor.description = Sends out gravity waves that drag enemy units toward the tower. Heavy units barely budge.
block.dg-permafrost.name = Permafrost
block.dg-permafrost.description = Keeps a freezing field around itself. Every enemy inside is chilled and slowed.
block.dg-glaciate.name = Glaciate
block.dg-glaciate.description = Releases a frost wave that freezes enemies solid for a few seconds. Frozen units can neither move nor shoot.
block.dg-repulsor.name = Repulsor
block.dg-repulsor.description = The opposite of the Gravitor: its waves throw enemies away. Tap it to switch between all enemies and ground units only.
block.dg-lineal.name = Lineal
block.dg-lineal.description = A heavy laser that cannot turn. Pick its direction while placing it, like a conveyor, or tap it later to rotate it by 45 degrees.
block.dg-barrage.name = Barrage
block.dg-barrage.description = Fires cluster missiles. On impact, at maximum range or when shot down they burst into heavy fragments. Blast compound fragments explode, pyratite fragments set things on fire.
block.dg-miasma.name = Miasma
block.dg-miasma.description = Sprays slowly spreading clouds of gas. Spore pods poison, pyratite burns and coal smoke slows.
block.dg-aegis.name = Aegis
block.dg-aegis.description = Its waves wipe out enemy bullets. Charged with phase fabric, the waves send the bullets back at the enemy instead.
block.dg-drizzle.name = Drizzle
block.dg-drizzle.description = Lobs single heavy droplets of liquid that splash and leave puddles.
block.dg-ricochet.name = Ricochet
block.dg-ricochet.description = Slow electric orbs that bounce from one enemy unit to the next, slowing down with every bounce. Does not lead its targets and never shoots at buildings.
block.dg-rotary.name = Rotary
block.dg-rotary.description = A rail minigun. Starts slowly and keeps spinning up while it fires.
block.dg-nest.name = Nest
block.dg-nest.description = Releases a fan of charges that hover for a second, then dart straight at the enemy. Does not lead its targets.
block.dg-sower.name = Sower
block.dg-sower.description = Lobs very slow harmless shells that scatter landmines at maximum range.
block.dg-lantern.name = Lantern
block.dg-lantern.description = Fires small glowing orbs that keep slowing down, hang in the air for a few seconds and then fade away.

